name: Release

# Pushing a v* tag ships that version: full test run, dashboard build,
# wheel smoke test, publish to PyPI via trusted publishing (no stored
# token), and a GitHub Release with the artifacts attached.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Check the tag matches the package version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $VERSION" >&2
            exit 1
          fi

      - name: Build release artifacts
        run: ./run release

      - name: Install wheel and smoke-test the entry point
        run: |
          uv venv smoke
          VIRTUAL_ENV=smoke uv pip install dist/*.whl
          smoke/bin/apron --version
          smoke/bin/python -c "from importlib.resources import files; assert (files('apron') / 'server/static/index.html').is_file(), 'dashboard missing from wheel'"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI and GitHub
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          # Everything before 1.0.0 is a beta: mark it as a pre-release on
          # GitHub. Flips off by itself at v1.0.0.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
