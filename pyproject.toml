[project]
name = "apronagents"
version = "0.1.0"
description = "Local multi-agent coding orchestrator with a sandboxed git staging area and a human review gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Utshav Khatiwada" }]
keywords = ["agents", "orchestration", "git", "code-review"]
dependencies = []

[project.scripts]
apron = "apron.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apron"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
